name: Generate GitHub Metrics

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Activity stats + isocalendar
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: FelipeLahti
          template: classic
          base: activity, community
          config_timezone: America/Sao_Paulo
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          filename: github-metrics.svg
          config_output: svg

      # Top languages (indepth analysis)
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: FelipeLahti
          template: classic
          base: ""
          plugin_languages: yes
          plugin_languages_details: percentage, bytes-size
          plugin_languages_limit: 8
          plugin_languages_indepth: yes
          filename: languages.svg
          config_output: svg

      # Full history contribution calendar (all years since account creation)
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: FelipeLahti
          template: classic
          base: ""
          plugin_calendar: yes
          plugin_calendar_limit: 0
          filename: calendar-full-history.svg
          config_output: svg

      # Coding habits (commits per hour/day charts)
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: FelipeLahti
          template: classic
          base: ""
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 30
          plugin_habits_facts: yes
          plugin_habits_charts: yes
          plugin_habits_charts_type: classic
          plugin_habits_languages_limit: 8
          config_timezone: America/Sao_Paulo
          filename: habits.svg
          config_output: svg

  snake:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: FelipeLahti
          github_token: ${{ secrets.METRICS_TOKEN }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  contrib-3d:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.METRICS_TOKEN }}
          USERNAME: FelipeLahti
      - name: Commit 3D profile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A profile-3d-contrib/
          git diff --staged --quiet || git commit -m "Update 3D contribution graph" && git push

  summary-cards:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.METRICS_TOKEN }}
        with:
          USERNAME: FelipeLahti
          BRANCH_NAME: main
          UTC_OFFSET: -3
      - name: Commit summary cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A profile-summary-card-output/
          git diff --staged --quiet || git commit -m "Update profile summary cards" && git push

  pacman:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: abozanona/pacman-contribution-graph@v2.3.0
        with:
          github_user_name: FelipeLahti
          github_token: ${{ secrets.METRICS_TOKEN }}
          outputs: |
            dist/pacman.svg?palette=github-dark
      - name: Commit pacman
        run: |
          mkdir -p pacman
          cp dist/pacman.svg pacman/ 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pacman/
          git diff --staged --quiet || git commit -m "Update pacman contribution graph" && git push
